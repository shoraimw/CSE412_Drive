name: drive_mobile
description: DRIVE rider, driver and vehicle-owner mobile app for CSE412.
publish_to: none
version: 0.3.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  firebase_storage: ^14.0.0
  flutter_riverpod: ^3.3.2
  google_sign_in: ^7.2.0
  file_picker: ^11.0.3
  intl: any
  google_maps_flutter: ^2.19.0
  geolocator: ^14.1.1
  firebase_database: ^13.0.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
