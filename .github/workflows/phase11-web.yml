name: Phase 11 Customer Web
on:
  push:
    paths:
      - "apps/web/**"
      - "netlify.toml"
      - ".github/workflows/phase11-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "netlify.toml"
      - ".github/workflows/phase11-web.yml"
jobs:
  web-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Run web domain tests
        working-directory: apps/web
        run: npm test
      - name: Build static website
        working-directory: apps/web
        run: npm run build
