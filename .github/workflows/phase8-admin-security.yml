name: Phase 8 Admin Firestore security rules
on:
  push:
    paths:
      - "firebase/firestore.rules"
      - "tests/firebase/firestore.test.mjs"
      - ".github/workflows/phase8-admin-security.yml"
  pull_request:
    paths:
      - "firebase/firestore.rules"
      - "tests/firebase/firestore.test.mjs"
      - ".github/workflows/phase8-admin-security.yml"
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulator-firestore-2026
      - name: Install Firebase test dependencies
        run: npm install --no-audit --no-fund
      - name: Verify admin reads, audit deny-writes and participant security
        run: npx firebase-tools emulators:exec --project demo-drive-local --only firestore "node --test --test-concurrency=1 tests/firebase/firestore.test.mjs"
