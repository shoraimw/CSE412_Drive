name: Phase 3 Flutter checks

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/phase3-flutter.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/phase3-flutter.yml"

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS platform scaffolding (no credentials)
        run: flutter create --project-name drive_mobile --platforms=android,ios .
      - name: Download dependencies
        run: flutter pub get
      - name: Prepare Android settings and FCM notification permission
        run: dart run tool/configure_phase6.dart
      - name: Generate English/Bangla localization
        run: flutter gen-l10n
      - name: Dart analyzer
        run: flutter analyze
      - name: Pure Dart and widget tests
        run: flutter test
      - name: Build emulator-demo Android APK
        run: |
          flutter build apk --release --dart-define=DRIVE_EMULATOR=true
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/drive-emulator-demo.apk
      - name: Upload emulator-demo APK
        uses: actions/upload-artifact@v4
        with:
          name: drive-android-emulator-demo
          path: apps/mobile/build/app/outputs/flutter-apk/drive-emulator-demo.apk
          if-no-files-found: error
          retention-days: 14
      - name: Check for configured Firebase secrets
        id: configured-firebase
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          if [ -n "$FIREBASE_PROJECT_ID" ] && [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_MESSAGING_SENDER_ID" ] && [ -n "$FIREBASE_STORAGE_BUCKET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare optional configured Firebase APK
        if: steps.configured-firebase.outputs.configured == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          python3 - <<'PY'
          import json, os
          keys = [
            'FIREBASE_PROJECT_ID', 'FIREBASE_API_KEY', 'FIREBASE_APP_ID',
            'FIREBASE_MESSAGING_SENDER_ID', 'FIREBASE_DATABASE_URL',
            'FIREBASE_STORAGE_BUCKET'
          ]
          config = {key: os.environ.get(key, '') for key in keys}
          config = {key: value for key, value in config.items() if value}
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'drive-firebase.json'), 'w') as f:
            json.dump(config, f)
          PY
      - name: Build Firebase-configured Android APK
        if: steps.configured-firebase.outputs.configured == 'true'
        run: |
          flutter build apk --release --dart-define-from-file="$RUNNER_TEMP/drive-firebase.json"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/drive-configured-release.apk
      - name: Upload Firebase-configured APK
        if: steps.configured-firebase.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drive-android-configured-release
          path: apps/mobile/build/app/outputs/flutter-apk/drive-configured-release.apk
          if-no-files-found: error
          retention-days: 14
