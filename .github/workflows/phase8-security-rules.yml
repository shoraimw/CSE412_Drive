name: Phase 8 focused security rules
on:
  push:
    paths:
      - "firebase/firestore.rules"
      - "firebase/storage.rules"
      - "tests/firebase/**"
      - "firebase.json"
      - ".github/workflows/phase8-security-rules.yml"
  pull_request:
    paths:
      - "firebase/firestore.rules"
      - "firebase/storage.rules"
      - "tests/firebase/**"
      - "firebase.json"
      - ".github/workflows/phase8-security-rules.yml"
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install Firebase rules unit testing
        run: npm install --no-audit --no-fund
      - name: Run Firebase rules security tests
        run: npm run test:rules
