[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-ml-service"
version = "0.1.0"
description = "DRIVE private inference API for audited historical-trip models"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
]
[project.optional-dependencies]
test = ["pytest>=8,<10","httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.setuptools]
packages = ["app"]
